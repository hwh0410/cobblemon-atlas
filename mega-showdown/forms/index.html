h:730px){.grid{grid-template-columns:1fr}.filters{flex-direction:column}.intro{padding:26px 0}}</style></head><body><header><div class="top"><b>◉ COBBLEMON ATLAS</b><a href="../index.html">← Mega Showdown 百科</a></div></header><main><section class="intro"><div class="overline">FIELD GUIDE / SPECIAL FORMS</div><h1>特殊型態圖鑑</h1><p>搜尋寶可夢，直接比較一般形態和特殊形態，並找到需要的道具。</p><div class="notice">第一版先收錄 12 筆已辨認的形態，圖片使用 Pokémon Showdown 動態圖作為辨識參考，並不是 Mega Showdown 模組的 3D 模型渲染。部分操作條件仍需在遊戲中驗證。</div></section><div class="filters"><input id="search" type="search" placeholder="路卡利歐、Lucario、朱紅色寶珠…" aria-label="搜尋寶可夢或道具"><select id="type"><option value="all">全部形態</option><option value="mega">超級進化</option><option value="primal">原始回歸</option><option value="fusion">融合</option><option value="other">其他</option></select></div><p id="count" class="muted"></p><div id="cards" class="grid"></div></main><footer><div>圖片辨識參考：<a href="https://play.pokemonshowdown.com/sprites/ani/">Pokémon Showdown sprites</a>。本站為非官方玩家資料庫；圖像與模組模型可能不一致。</div></footer><script>const data=[["路卡利歐","Lucario","mega","超級路卡利歐","lucario","lucario-mega","lucarionite","路卡利歐進化石"],["固拉多","Groudon","primal","原始固拉多","groudon","groudon-primal","red_orb","朱紅色寶珠"],["蓋歐卡","Kyogre","primal","原始蓋歐卡","kyogre","kyogre-primal","blue_orb","靛藍色寶珠"],["噴火龍","Charizard","mega","超級噴火龍 X","charizard","charizard-megax","charizardite_x","噴火龍進化石 X"],["噴火龍","Charizard","mega","超級噴火龍 Y","charizard","charizard-megay","charizardite_y","噴火龍進化石 Y"],["妙蛙花","Venusaur","mega","超級妙蛙花","venusaur","venusaur-mega","venusaurite","妙蛙花進化石"],["水箭龜","Blastoise","mega","超級水箭龜","blastoise","blastoise-mega","blastoisinite","水箭龜進化石"],["耿鬼","Gengar","mega","超級耿鬼","gengar","gengar-mega","gengarite","耿鬼進化石"],["烈空坐","Rayquaza","mega","超級烈空坐","rayquaza","rayquaza-mega","","觸發方式需核對"],["酋雷姆","Kyurem","fusion","黑酋雷姆","kyurem","kyurem-black","dna_splicer","基因之楔"],["酋雷姆","Kyurem","fusion","白酋雷姆","kyurem","kyurem-white","dna_splicer","基因之楔"],["甲賀忍蛙","Greninja","other","小智版甲賀忍蛙","greninja","greninja-ash","","牽絆變化，條件待驗證"]];const labels={mega:"超級進化",primal:"原始回歸",fusion:"融合形態",other:"其他型態"};const $=s=>document.querySelector(s);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const gif=id=>"https://play.pokemonshowdown.com/sprites/ani/"+id+".gif";const icon=id=>"https://raw.githubusercontent.com/yajatkaul/CobblemonMegaShowdown/main/common/src/main/resources/assets/mega_showdown/textures/item/"+id+".png";function render(){let q=$("#search").value.trim().toLowerCase(),kind=$("#type").value,found=data.filter(e=>(kind==="all"||e[2]===kind)&&e.join(" ").toLowerCase().includes(q));$("#count").textContent="符合 "+found.length+" / "+data.length+" 筆";$("#cards").innerHTML=found.map(e=>'<article class="card"><div class="category">'+labels[e[2]]+' · '+esc(e[1])+'</div><h2>'+esc(e[0])+'</h2><div class="pair"><div class="sprite"><img loading="lazy" src="'+gif(e[4])+'" alt="一般形態"><small>一般形態</small></div><div class="sprite"><img loading="lazy" src="'+gif(e[5])+'" alt="'+esc(e[3])+'"><small>'+esc(e[3])+'</small></div></div><div class="item">'+(e[6]?'<img loading="lazy" src="'+icon(e[6])+'" alt="">':'')+'<div class="iteminfo"><b>'+esc(e[7])+'</b><small>'+(e[6]?'mega_showdown:'+esc(e[6]):'需核對實際條件')+'</small></div>'+(e[6]?'<a href="../index.html?item=mega_showdown%3A'+encodeURIComponent(e[6])+'">查道具 ↗</a>':'')+'</div></article>').join("")||"<p>沒有符合條件的條目。</p>"}$("#search").addEventListener("input",render);$("#type").addEventListener("change",render);render();</script></body></html>
